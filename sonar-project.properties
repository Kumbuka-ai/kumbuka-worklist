# SonarQube Cloud — kumbuka-worklist.
#
# The scan runs in .github/workflows/ci.yml (job "code quality"), after
# `mvn verify` has produced both the compiled binaries Sonar reads and the
# JaCoCo XML report it takes coverage from.
sonar.organization=kumbuka-ai
sonar.projectKey=Kumbuka-ai_kumbuka-worklist

sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.sourceEncoding=UTF-8

sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclusions — context, not laziness.
#
#  - **/db/migration/**: PostgreSQL under Flyway. Sonar parses .sql with its
#    PL/SQL analyser and reads these as Oracle, reporting VARCHAR -> VARCHAR2
#    and duplicate-literal noise. Taking that advice would break the database.
#    The migrations are forward-only and reviewed one at a time.
sonar.exclusions=**/db/migration/**
