notFound=Check the address, and that you are a member of the scope it names.
verbNotCarried=Call one of the verbs under accepts, with a method the Allow header names.
headerInvalid=Send Kumbuka-Surface: assistant once, or leave the header out.
addressMalformed=Write it as worklist://<scope>/<view>/<number>: the scope a lower-case DNS label, the view one of item, iteration, milestone and workstream, the number a whole number from 1; a membership adds the item number after the iteration number.
verbUncarried=Call {attempted} at the view its description in tools/list names, or call the verb this view carries for the same effect.
verbUnbuilt=Call the verbs tools/list names today, and call {attempted} again once tools/list names it.
selectorDeclaredNotWritten=Read and query workstreams here, and declare a workstream on the selector-declaration surface.
writeOnTruncatedAddress=Address the object by its complete address and write the verb after a colon, as <number>:<verb>.
addressReadOnly=Read 'current' to learn the iteration's number, then write at that number.
conflictTokenMissing=Read the object and send its conflict_token, on REST as If-Match.
payloadMalformed=Send the body as one JSON object of the arguments the verb declares.
argumentInvalid=Send the argument under offenders, or the header the call names, in the form the declaration of this call gives; tools/list carries that declaration.
argumentMissing=Send each of them with a value.
argumentUnknown=Send only the arguments under accepts.
unexpectedFailure=Report the reference under data.reference to the operator of this service.
sessionNotBound=Report the failure to the operator of this service and retry the call later.
scopeKindUnsupported=Address a project or a global scope.
scopeLocked=Ask whoever locked the scope to lift the lock, then retry the write.
scopeReadOnly=Ask an administrator of the scope's membership for the write right, then retry the write.
fieldRetracted=Leave the fields under offenders out of the call, and file the work through the items that aim at the milestone.
fieldNotSettable=Send those fields back as a read answers them, or leave them out.
invalidValue=Send it in the form and within the bounds the description of fields in tools/list names.
conflict=Read the object again, apply the change to what the read answers, and send its new conflict_token.
selectorUndeclared=Address a view this scope declares, or declare this view in the scope first.
selectorWithdrawn=Read the objects it issued, and create new ones in a view the scope declares.
viewUnknown=Name one of item, iteration, milestone and workstream.
valueUndeclared=Use a value this scope declares, by the name a read of an object answers it under.
pageSizeRejected=Send page_size as a whole number from 1 to {bound}, and follow next_cursor of the answer for the objects beyond one page.
cursorMalformed=Pass back next_cursor unchanged, or call query again from the first page.
cursorForeign=Pass back the next_cursor of this query, or call query again from the first page.
sortUndeclared=Send sort as one of the values its description in tools/list names for this view.
predicateUnknown=Use one of the filters under accepts.
identifierUndecided=Address the item by the address it carries; call accept again once the identifier is decided.
markRegression=Send a mark at or above the one a read of the selector answers.
membershipPresent=Read the membership to learn its place, or unplan the item first to plan it again.
iterationClosed=Plan the work into an open iteration.
iterationIncomplete=Read the iteration's memberships, mark each one done or dropped, then close the iteration.
iterationAbsent=Create an iteration and plan it, or read the iteration view to find the one to address.
itemUnplannable=Read the item, give it an actionable status and a milestone on the product path, then plan it.
settingAbsent=Open the scope with its four cardinality numbers, then retry.
settingPresent=Change the settings with update and the conflict token of their last read.
cardinalityExceeded=Read the scope's settings, then raise the limit there or make room before you retry.
claimHeld=Retry once the lease lapses or its holder releases it, or call claim_next for another item.
claimAbsent=Claim the item first to hold it.
claimReceiptUnknown=Send the receipt the claim answered with, exactly as it came.
drawEmpty=Retry once a lease lapses or a holder releases one.
workstreamWithdrawn=Name a workstream the scope keeps open; query the workstream view to list them.
workstreamHasReferences=Declare a new workstream and move the pointers to it.
workstreamDefaultLocked=Change the description, and declare a new workstream for anything else.
workstreamMilestoneMismatch=Give the item a milestone of its own workstream, or move the item to the milestone's workstream.
itemWorkstreamMissing=Name a workstream the scope declares, or leave the field out to take the scope's default workstream.
iterationProducedMissing=Send produced with a few words that name what the iteration produced.
protocolEnvelope=Send jsonrpc as 2.0, with method and id.
protocolMethod=Call initialize, ping, tools/list or tools/call.
protocolTool=Call one of the tools under data.accepts; tools/list describes each.
