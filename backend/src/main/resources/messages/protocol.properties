envelopeRequired=the request lies outside the JSON-RPC 2.0 envelope. Send jsonrpc as 2.0, with method and id.
methodUnknown=the method lies outside the methods of this server. Call initialize, ping, tools/list or tools/call.
toolUnknown=the tool named lies outside the tools of this server. Call one of the tools under data.accepts; tools/list describes each.
