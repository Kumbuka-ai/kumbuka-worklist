create=Creates one object in one view of a scope: an item, an iteration or a milestone. The service allocates its number in the same transaction, and the answer carries the complete address the object got. An item starts as a draft, in a status of the phase open. Each acceptance criterion of an item gets an identifier the service issues once. A member with the write right of the scope calls it. Usually followed by update, and for an item by submit.
read=Reads one object by its complete address and leaves the store as it is. A member of the scope calls it. The answer carries the object's fields, its conflict_token, which each write on the object presents, and next: the calls open to you on the object in its state, each with what it does. An item's answer carries its phase and predicates: closed, actionable and in_progress always, successful where closed holds, and reviewed, approved and verified where the scope uses them.
update=Changes fields of one object. A write whose values equal the held ones leaves the object, its timestamps and its conflict token as they are. A member with the write right calls it with the conflict_token of the last read. An item takes a status of its own phase here, a draft one of the phase open; submit, start, return and close move the phase. Criteria keep their identifiers: a new entry gets a fresh one, and a criterion left out is withdrawn. Usually preceded by read.
query=Reads one page of the objects of one view and leaves the store as it is. filter narrows the page, page_size bounds it, sort and direction order it. The answer carries next_cursor while more objects follow; pass it back as after, with the same scope, selector, filter, sort and direction, to read the next page. A member of the scope calls it.
close=Closes an iteration, a milestone or an item; the closed state is final, and read stays open on it. An iteration closes once each of its memberships is done or dropped, and names what it produced. An open item or one in progress closes into the status named, of the phase closed, or the first the scope declares, and gets its close_date; leaving in_progress takes a reason. A member with the write right calls it with the object's conflict_token.
submit=Submits a draft: it moves to the phase open and keeps its status. The draft carries a title and a workstream. A member with the write right of the scope calls it with the item's conflict_token. Usually followed by start or plan.
discard=Deletes a draft with its references, criteria, tags and relations; its number stays spent. A draft takes it, and every other phase refuses it. A member with the write right of the scope calls it with the item's conflict_token.
start=Moves an open item to the phase in_progress, into the status named or the first of that phase the scope declares. Its status answers actionable, and the item carries a type, its attribute type. A member with the write right of the scope calls it with the item's conflict_token. Usually followed by update, return or close.
returnItem=Moves an item in progress back to the phase open, with a reason, into the status named or the first of that phase the scope declares. A member with the write right of the scope calls it with the item's conflict_token.
advance=Promotes the first planned iteration of the scope to current, exactly one, in the scope's own order; it takes the scope and the iteration view in place of an address. It presents the conflict_token of the scope's settings, which hold the pointer. Usually followed by plan into the new current iteration.
plan=Adds an item to an open iteration, at the end of its order. The item is open or in progress, whatever its milestone, and it joins an iteration once. It presents the iteration's conflict_token. Usually followed by update of the membership as the work proceeds.
unplan=Removes an item from an open iteration. It presents the iteration's conflict_token.
relate=Asserts one directed, typed edge from this item to another item of the same scope. Asserting a standing edge leaves it as it is, and asserting a withdrawn one restores it. The type duplicate_of also closes this item, as closed and unsuccessful, into the status the scope names for that type; it is open while the item is open. It presents the item's conflict_token. validate reports cycles over relation types that block.
unrelate=Withdraws one asserted edge from this item to another; the edge stays on record with its status moved. It presents the item's conflict_token.
tagAttach=Attaches one tag of the scope's vocabulary to a draft, an open item or one in progress. The tag is a relation: the item's conflict_token and changed_at stay as they are, and the call takes the address and the tag alone. Attaching a tag the item carries leaves it as it is; a withdrawn tag is refused. A member with the write right calls it. The answer is the item with its tags. Usually followed by query with the filter tag.
tagDetach=Detaches one tag from an item; a withdrawn tag detaches too. The item's conflict_token and changed_at stay as they are, and the call takes the address and the tag alone. Detaching a tag the item lacks leaves it as it is. A member with the write right calls it. The answer is the item with its tags.
validate=Walks the scope and reports each consistency the store keeps by checking: today the cycles over relation types that block. It leaves the store as it is. A member of the scope calls it.
book=Books what one instance reported against the acceptance criteria of an item that is open, in progress or closed: per entry a criterion, a status (met, not_met or not_applicable) and an evidence reference. The ledger is append-only and stands beside the item: its conflict_token and changed_at stay. The actor is your own identity. A member with the write right calls it; a later step narrows a closed item to the identity concluding an instance. read answers the ledger as fulfilment.
