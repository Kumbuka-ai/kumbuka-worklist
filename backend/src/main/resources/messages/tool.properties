create=Creates one object in one view of a scope: an item, an iteration or a milestone. The service allocates its number in the same transaction, and the answer carries the complete address the object got. A member with the write right of the scope calls it. Usually followed by read or update, and for an item by plan.
read=Reads one object by its complete address and leaves the store as it is. A member of the scope calls it. The answer carries the object's fields and its conflict_token, which each write on the object presents.
update=Changes fields of one object. A write whose values equal the held ones leaves the object, its timestamps and its conflict token as they are. A member with the write right calls it with the conflict_token of the last read. An item reaches a closed status this way. Usually preceded by read.
query=Reads one page of the objects of one view and leaves the store as it is. filter narrows the page, page_size bounds it, sort and direction order it. The answer carries next_cursor while more objects follow; pass it back as after, with the same scope, selector, filter, sort and direction, to read the next page. A member of the scope calls it.
accept=The intake gate of an item. It answers IDENTIFIER_UNDECIDED today: an item carries its address from its creation, and the business identifier beside it is an open decision. Address items by the address create gives them.
withdraw=Takes an item back: the item moves into a status the scope declared as closed and keeps its address for good, so every reference to it keeps resolving. A member with the write right calls it with the item's conflict_token.
close=Closes an iteration or a milestone; the closed state is final. An iteration closes once each of its memberships is done or dropped, and names what it produced. A member with the write right calls it with the object's conflict_token. An item reaches a closed status through update or withdraw.
advance=Promotes the first planned iteration of the scope to current, exactly one, in the scope's own order; it takes the scope and the iteration view in place of an address. It presents the conflict_token of the scope's settings, which hold the pointer. Usually followed by plan into the new current iteration.
plan=Adds an item to an open iteration, at the end of its order. The item is actionable and aims at a milestone on the product path, and it joins an iteration once. It presents the iteration's conflict_token. Usually followed by update of the membership as the work proceeds.
unplan=Removes an item from an open iteration. It presents the iteration's conflict_token.
claim=Takes a lease on an item for a number of seconds, so that one holder acts on it at a time. The answer carries a receipt, which release presents; the lease ends by itself when its time runs out. A member with the write right calls it. Usually followed by update and release.
release=Ends a lease by presenting the receipt that claim answered with. The check is on the receipt, so a holder that hands the receipt on hands the lease on.
claimNext=Draws the next addressable item of the scope that is free of a lease, in the order of the item view, and takes a lease on it in the same step. The answer carries the item and the receipt. A scope with items answers DRAW_EMPTY while every item is held.
relate=Asserts one directed, typed edge from this item to another item of the same scope. Asserting a standing edge leaves it as it is, and asserting a withdrawn one restores it. It presents the item's conflict_token. validate reports cycles over relation types that block.
unrelate=Withdraws one asserted edge from this item to another; the edge stays on record with its status moved. It presents the item's conflict_token.
validate=Walks the scope and reports each consistency the store keeps by checking: today the cycles over relation types that block. It leaves the store as it is. A member of the scope calls it.
