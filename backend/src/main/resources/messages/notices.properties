plannedIterationsAtThreshold=the scope's planned iterations stand at or past the warning threshold it set for itself; the hard limit refuses rather than warns, and a read of the scope's settings answers both numbers.
membershipsAtThreshold=the iteration's memberships stand at or past the warning threshold the scope set for itself; the hard limit refuses rather than warns, and a read of the scope's settings answers both numbers.
blockingCycle=these items form a cycle over relation types that block, so each one waits on another for good; a read of any one of them shows its edges alone.
