viewItem=the items of the scope, the work itself
viewIteration=the iterations, the scope's time axis
viewMilestone=the milestones, the scope's goal axis
viewWorkstream=the workstreams, the scope's lines of work
sortId=the object's number
sortCreatedAt=when the object was created, then its number
sortRank=the object's rank, then its number; on the iteration and milestone views
directionAsc=ascending, the smallest first
directionDesc=descending, the largest first
