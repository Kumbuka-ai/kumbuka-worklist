scope=The scope's name, a lower-case DNS label.
selectorCreate=The view to create in: item, iteration or milestone, in lower case.
selectorQuery=The view to read: item, iteration, milestone or workstream, in lower case.
selectorIteration=The view this acts on, which is iteration.
selectorItem=The view this acts on, which is item.
address=The complete address, worklist://<scope>/<view>/<number>. An iteration also answers to current, the iteration the scope is working; write at the iteration's number.
addressMembership=The membership's address, worklist://<scope>/iteration/<iteration number>/<item number>.
conflictToken=The conflict_token of the last read of this object. A membership presents the token of its iteration.
conflictTokenSetting=The conflict_token of the scope's settings, as the last advance answered it.
fields=The object's fields, under the names a read answers with. An item takes title (text of at most {titleBound} characters), description, status (a status the scope declares, by name), milestone (a milestone number of the scope), workstream (a workstream token the scope declares), attributes (a map from a declared attribute key to its value), references and relations (lists of entries; a relation entry carries type and item). A milestone takes title, status (planned, active or closed), kind, vision, mission and rank. An iteration takes title, motto, description, rank and order. A read answer may go back as it came: a field sent with the value it holds stays as it is.
filter=An object from filter name to one value. The item view filters by status (a status name the scope declares), milestone (a milestone number) and workstream (a workstream token); the iteration view by closed (true or false); the milestone view by status (planned, active or closed) and kind; the workstream view by status. Default: the whole view. Sending null equals leaving the argument out.
pageSize=How many objects one page carries, from 1 to {max}. Default: {size}. Sending null equals leaving the argument out.
after=The next_cursor of the previous answer of the same query, exactly as it came. Default: the first page. Sending null equals leaving the argument out.
sort=The order of the page. Default: id. Sending null equals leaving the argument out.
direction=The direction of the order. Default: asc. Sending null equals leaving the argument out.
status=The closed status to move the item into, by the name the scope declared it under.
produced=What the iteration produced, in a few words; an iteration closes with it, and a milestone closes with its address alone. Default: unset. Sending null equals leaving the argument out.
durationSeconds=The length of the lease in seconds, a positive whole number.
receipt=The receipt from the answer of claim, exactly as it came.
toItem=The complete address of the item at the other end of the edge, worklist://<scope>/item/<number>, in the scope of this item.
type=The relation type, by the name the scope declared it under.
idempotencyKey=A key of your own for this create; on REST it travels in the header Idempotency-Key. Repeated with the same arguments within 24 hours, it answers the object the first call made, and the call is carried out once. Default: each call creates an object of its own. Sending null equals leaving the argument out.
