read=Reads the object at this address as it stands now.
update=Changes fields of the object at this address; send the conflict_token of your last read.
close=Closes the object at this address for good; an iteration closes once each membership is done or dropped, and with what it produced named.
advance=Promotes the first open iteration of the scope other than the current one to current, with the conflict_token of the scope's settings.
planItem=Adds this item to the iteration of this membership address, at the end of its order, with the iteration's conflict_token.
planIteration=Adds an item to this iteration, at the end of its order: call it at this address followed by /<item number>, with the iteration's conflict_token.
unplan=Takes the item of this membership out of its iteration, with the iteration's conflict_token.
relate=Asserts a typed edge from this item to another item of the scope, with the item's conflict_token.
unrelate=Cancels an active edge from this item to another, with a reason and the item's conflict_token.
tagAttach=Attaches a tag of the scope's vocabulary to this item.
tagDetach=Detaches a tag from this item.
book=Books what an instance reported against the acceptance criteria of this item in its fulfilment ledger.
addendum=Writes an addendum on this item, an append-only text that corrects or comments its frozen content.
submit=Submits this draft, which becomes open, with the item's conflict_token.
discard=Deletes this draft for good, with the item's conflict_token.
start=Starts the work on this item, which moves to in_progress, with the item's conflict_token.
returnItem=Returns this item to the phase open, with a reason and the item's conflict_token.
closeItem=Closes this item for good, into a status of the phase closed, with the item's conflict_token; an item in progress closes with a reason.
