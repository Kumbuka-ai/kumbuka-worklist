notFound=nothing is addressed here.
addressMalformed=the address lies outside the grammar of the worklist scheme.
verbNotCarried=the method lies outside the methods this address carries.
headerInvalid=the Kumbuka-Surface header takes the one value assistant, sent once, and it arrived otherwise.
verbUncarried={attempted} lies outside the verbs this address carries.
verbUnbuilt={attempted} is a verb of the worklist scheme that this service has yet to build.
selectorDeclaredNotWritten={attempted} writes, and a workstream comes into being by its declaration, on the selector-declaration surface.
writeOnTruncatedAddress=the verb named acts on a complete address, and this address is truncated.
addressReadOnly='current' is a pointer the scope moves, and a write through it would land on whichever iteration is current when the call arrives.
conflictTokenMissing=this write takes the conflict token of the object's last read, and the call came without one.
payloadMalformed=the request body lies outside the JSON this verb takes.
argumentInvalid=an argument of the call arrived in a form outside the forms it admits.
argumentMissing=the arguments under offenders are mandatory, and the call left them out or sent them as null.
argumentUnknown=the call carries an argument outside the ones it declares, and the service wrote nothing.
unexpectedFailure=the call failed inside the service. The failure is a defect of the service rather than a rule of the call, and the service changed nothing.
sessionNotBound=the service failed to bind the session it reads scopes under.
scopeKindUnsupported=the scope is a private scope, and the worklist keeps its objects in project and global scopes.
scopeLocked=the scope is locked, and a locked scope refuses every write; reading it stays open.
scopeReadOnly=this subject may read the scope and holds no right to write in it.
fieldRetracted=the fields under offenders were retracted from this object: a milestone belongs to no workstream, and an item carries the workstream of its work.
fieldNotSettable=the fields under offenders belong to the service, and the call gives them a value other than the one they hold.
invalidValue=the value of the field under offenders lies outside what that field admits here.
conflict=the conflict token sent differs from the one the object carries: the object changed after that read.
selectorUndeclared=the view of this address lies outside the views this scope declares.
selectorWithdrawn=the view of this address is withdrawn in this scope; what it issued keeps resolving.
viewUnknown=the selector names a view outside the platform's four.
valueUndeclared=the value of the argument under offenders lies outside what this scope declares.
pageSizeRejected=page_size lies outside its range.
cursorMalformed=after carries text other than a cursor this service handed out.
cursorForeign=after carries a cursor of another query; a cursor continues the query that handed it out, with the same scope, view, filter, sort and direction.
sortUndeclared=sort names an order outside the ones this view offers on this surface.
predicateUnknown=filter carries a name outside the filters this view declares.
identifierUndecided=an item carries its address from its creation, and what a business identifier beside it should be is still open.
markRegression=the high-water mark named lies below the mark that stands, and a mark moves forward only.
membershipPresent=the item is already a member of this iteration.
iterationClosed=the iteration is closed, and a closed iteration is a record that takes no further write.
iterationIncomplete=the iteration still holds memberships that are neither done nor dropped.
iterationAbsent=the scope holds no open iteration for this call to reach.
itemUnplannable=the item lies outside what an iteration takes: an iteration takes actionable items aimed at a milestone on the product path.
settingAbsent=the scope carries no settings yet, so its cardinality limits are unset.
settingPresent=the scope already carries its settings, one set per scope.
cardinalityExceeded=the write would carry the scope past a limit it set for itself.
claimHeld=a live lease stands on the item, and one holder acts at a time.
claimAbsent=no live lease stands on the item to release.
claimReceiptUnknown=the receipt names a lease other than the one the item holds.
drawEmpty=every addressable item in the scope is held right now.
workstreamWithdrawn=the workstream named is withdrawn and takes no new work; what it holds keeps resolving.
workstreamHasReferences=a workstream is renamable while nothing points at it, and an item or a milestone points at this one.
workstreamDefaultLocked=the default workstream keeps its identity; its description is the one settable part.
workstreamMilestoneMismatch=the item's milestone lies in another workstream than the item.
itemWorkstreamMissing=an item carries a workstream on every status.
iterationProducedMissing=an iteration closes with what it produced named.
protocolEnvelope=the request lies outside the JSON-RPC 2.0 envelope.
protocolMethod=the method lies outside the methods of this server.
protocolTool=the tool named lies outside the tools of this server.
