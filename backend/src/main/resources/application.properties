# ===========================================================================
# The worklist service.
#
# Every value below that names an environment carries the WORKLIST_ prefix
# and a development default that points at localhost. There is no deployment
# hostname in this file, and none belongs here: this repository is public,
# and a default that happens to name a real host is a deployment detail that
# has escaped its deployment.
# ===========================================================================

quarkus.application.name=worklist
quarkus.http.port=8080

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
# INFO in production. DEBUG is the trace inside a verb and is switched on when
# somebody is looking; INFO is the completed transition and the service start,
# which is what a running deployment should say without being asked.
quarkus.log.category."ai.kumbuka.worklist".level=INFO

# ---------------------------------------------------------------------------
# Datasource — the RUNTIME connection.
#
# The service connects as its own role and as nothing else. That role OWNS
# NOTHING: it holds `USAGE` on this service's schema and the three privileges
# V2 enumerates on each of its tables, holds nothing at all on the Flyway
# history table, and carries neither superuser nor BYPASSRLS — which is what
# makes the row-level-security policies bind it.
#
# `quarkus.datasource.username` is also what the privilege probe reads to
# learn which role it is asking about. It is deliberately not duplicated into
# a second key: a probe reading its expectation from a copy would be checking
# that two settings agree rather than that the database is right.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${WORKLIST_DB_USERNAME:kumbuka_worklist}
quarkus.datasource.password=${WORKLIST_DB_PASSWORD:change-me-kumbuka-worklist}
quarkus.datasource.jdbc.url=${WORKLIST_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Hibernate's @TenantId filter sends the tenant as the entity field's type
# (String, because the Quarkus tenant-resolver SPI is String-only) while the
# column is `uuid`. Without this, pgjdbc tags the parameter as VARCHAR and
# PostgreSQL rejects `uuid = varchar`; with it, the type is inferred from the
# column instead.
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# ---------------------------------------------------------------------------
# Flyway — the MIGRATING connection, deliberately a different role.
#
# The migration set creates a role, which is a privileged act, so the migrator
# holds CREATEROLE and CREATE on the database. It also KEEPS ownership of
# everything it creates, including the history table, and grants the runtime
# role the enumerated privileges it needs (V2).
#
# That is the one place this service departs from the substrate template it
# is otherwise a copy of. The template normalises ownership to the runtime
# role in an afterMigrate callback, and an owner holds the whole ACL on what
# it owns — TRUNCATE included, and on the history table too, since that table
# lives in the schema the sweep walks. TRUNCATE bypasses row-level security
# entirely, so that is a hole in the tenant boundary no policy can see. There
# is therefore no ownership callback here, and `ServiceRolePrivilegeIT` reads
# the catalog to keep the enumerated list from drifting.
#
# `quarkus.flyway.default-schema` is also what the probes read to learn which
# schema is this service's own.
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.default-schema=worklist
quarkus.flyway.schemas=worklist
quarkus.flyway.create-schemas=true
quarkus.flyway.username=${WORKLIST_MIGRATOR_USERNAME:postgres}
quarkus.flyway.password=${WORKLIST_MIGRATOR_PASSWORD:postgres}
quarkus.flyway.jdbc-url=${WORKLIST_DB_JDBC_URL:jdbc:postgresql://localhost:5432/kumbuka}

# Callbacks are resolved from THIS key by class name and instantiated
# reflectively. The extension does NOT discover them as CDI beans, and a
# callback left out of this line is never registered — with no warning, no
# error, and migrations that run happily without it. The class named here has
# a probe that observes it firing, because that is the only way this line can
# be known to be right.
quarkus.flyway.callbacks=ai.kumbuka.worklist.tenancy.TenantMigrationCallback

# Flyway owns the schema; Hibernate only checks that it matches. Generating
# DDL from the entities would let a mapping change rewrite the database
# without a migration, and a row-level-security policy is exactly the kind of
# thing such a rewrite drops silently. It would also fail outright here: the
# runtime role holds no CREATE on its own schema.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.database.default-schema=worklist
quarkus.hibernate-orm.log.sql=false

# Layer 1 of tenant enforcement: Hibernate filters every ORM-routed statement
# on @TenantId. Layer 2 is the database policy (V3). The current-tenant lookup
# runs through HibernateTenantResolver, which reads TenantContext.current().
quarkus.hibernate-orm.multitenant=DISCRIMINATOR

# ---------------------------------------------------------------------------
# Identity — the tenant realm, and no other.
#
# A bearer resource server: the audience and the issuer are both checked, so a
# token minted by another realm of the same server is refused rather than
# merely unauthorised. The operator realm is one such other realm, and its
# tokens are refused here on purpose — provider-plane identity is not an
# authorisation for a tenant's worklist.
# ---------------------------------------------------------------------------
quarkus.oidc.auth-server-url=${WORKLIST_OIDC_ISSUER:http://localhost:8180/realms/kumbuka}
quarkus.oidc.client-id=${WORKLIST_OIDC_CLIENT_ID:kumbuka-worklist}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${WORKLIST_OIDC_AUDIENCE:kumbuka-worklist}
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Authorship is derived from the token's stable subject, never from a display
# name. Quarkus' default for a service application falls through
# upn -> preferred_username -> sub, so an email address can end up recorded as
# the actor — and an identifier that can change is one that stops matching the
# rows it wrote.
quarkus.oidc.token.principal-claim=sub

# ---------------------------------------------------------------------------
# Service configuration.
# ---------------------------------------------------------------------------
# The tenancy axis for this deployment. Read by ConfiguredTenantResolver and
# by the Flyway callback that binds the GUC for migrations carrying DML.
#
# There is deliberately no companion `worklist.scope-id`. The sibling service
# carries one because a migration of its own declares selectors under it;
# this service's migration set is pure DDL, nothing in the code would read
# the value, and a configuration key that nothing reads is a key that will be
# wrong by the time something does.
worklist.tenant-id=${WORKLIST_TENANT_ID:00000000-0000-0000-0000-000000000001}

quarkus.smallrye-health.root-path=/q/health
